<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpana S. Design</title>
    <meta
      name="description"
      content="Blending 26 years of architectural expertise with fresh design thinking, this elegant website showcases the studio's thoughtfully crafted interiors and timeless design philosophy."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Tab favicon = src/images/logo.jpeg -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />

    <!--
      WhatsApp / Facebook / Instagram share image:
      HomePage2-og.jpg is a 1200×630 crop of src/images/HomePage2.png
      (WhatsApp requires landscape; tall portraits often fall back to the favicon/logo).
      Absolute URL is rewritten per-host by netlify/edge-functions/og-host.js
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alpanas.design/" />
    <meta property="og:title" content="Alpana S. Design" />
    <meta
      property="og:description"
      content="Blending 26 years of architectural expertise with fresh design thinking, this elegant website showcases the studio's thoughtfully crafted interiors and timeless design philosophy."
    />
    <meta property="og:image" content="https://alpanas.design/HomePage2-og.jpg?v=5" />
    <meta property="og:image:secure_url" content="https://alpanas.design/HomePage2-og.jpg?v=5" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alpana S. Design interior" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alpana S. Design" />
    <meta
      name="twitter:description"
      content="Blending 26 years of architectural expertise with fresh design thinking, this elegant website showcases the studio's thoughtfully crafted interiors and timeless design philosophy."
    />
    <meta name="twitter:image" content="https://alpanas.design/HomePage2-og.jpg?v=5" />

    <link rel="image_src" href="/HomePage2-og.jpg?v=5" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
