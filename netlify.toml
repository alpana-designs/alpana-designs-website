[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Rewrite og:image to the current host so every domain alias gets a working preview.
[[edge_functions]]
  function = "og-host"
  path = "/*"

# Keep share/favicon assets reachable (do not SPA-fallback them).
[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.jpg"
  status = 200
  force = false

[[redirects]]
  from = "/HomePage2.jpg"
  to = "/HomePage2.jpg"
  status = 200
  force = false

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200
  force = false

# SPA fallback for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
